name: Production database and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations-check:
    name: Validate migrations on a fresh database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Supabase CLI
        uses: supabase/setup-cli@d347ba47d3fb7eeeddbbc793bc8d4779caf773ea # v1.5.0
        with:
          version: 2.122.0
      - name: Point Supabase CLI at the Docker host
        shell: bash
        run: |
          # Gitea Actions runs the job in a container but starts the Supabase
          # containers on the Docker host. The job's default gateway is that host,
          # so rewrite the CLI's 127.0.0.1 service URLs to it.
          if [[ -f /.dockerenv ]]; then
            host=$(ip -4 route show default 2>/dev/null | awk 'NR == 1 { print $3 }')
            if [[ -z "$host" ]] && command -v docker >/dev/null 2>&1; then
              job_id=$(docker inspect --format '{{.Id}}' "$(cat /etc/hostname)" 2>/dev/null || true)
              host=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}' "$job_id" 2>/dev/null || true)
            fi
            if [[ -n "$host" ]]; then
              echo "SUPABASE_SERVICES_HOSTNAME=$host" >> "$GITHUB_ENV"
              echo "Using Docker host $host for local Supabase services."
            fi
          fi
      - name: Apply all migrations to a disposable local database
        run: supabase db start --yes

  production:
    name: Migrate then promote production branch
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: migrations-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: production-database-and-deploy
      cancel-in-progress: false
    steps:
      - name: Check production configuration
        id: config
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" || -z "$SUPABASE_PROJECT_REF" ]]; then
            echo "::notice::Production rollout skipped: configure SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_REF in the repository Actions secrets. No migrations or deployment branch updates were performed."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Checkout exact rollout commit
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check deployment branch before database changes
        if: steps.config.outputs.configured == 'true'
        id: rollout
        shell: bash
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main refs/heads/production:refs/remotes/origin/production
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "::notice::A newer main commit exists. Skipping this stale rollout; run the workflow for the latest main commit."
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/production "$GITHUB_SHA"; then
            echo "::error::production must be an ancestor of this commit. Resolve branch divergence manually; this workflow never force-pushes."
            exit 1
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Install Supabase CLI
        if: steps.rollout.outputs.current == 'true'
        uses: supabase/setup-cli@d347ba47d3fb7eeeddbbc793bc8d4779caf773ea # v1.5.0
        with:
          version: 2.122.0

      - name: Check migration history and apply pending migrations
        if: steps.rollout.outputs.current == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          NO_COLOR: '1'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes
          supabase migration list --linked --output-format json > "$RUNNER_TEMP/migration-history.json"
          cat "$RUNNER_TEMP/migration-history.json"
          # These two migrations were applied through SQL Editor before CLI tracking.
          # An empty or incomplete baseline must never trigger their re-execution.
          python3 - "$RUNNER_TEMP/migration-history.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1]) as history:
              rows = json.load(history)["migrations"]
          for version in ("20261027000000", "20261027010000"):
              if not any(row["local"] == version and row["remote"] == version for row in rows):
                  sys.exit("::error::Production migration baseline is missing. Follow docs/database.md before retrying; no migrations have been pushed.")
          PY
          # CLI preflight rejects unknown remote versions and missing earlier versions
          # before any pending migrations are executed. Never bypass it with include-all.
          supabase db push --linked --dry-run --skip-vault --yes
          supabase db push --linked --skip-vault --yes

      - name: Promote migrated commit to Hostinger deployment branch
        if: steps.rollout.outputs.current == 'true'
        shell: bash
        run: |
          # Ordinary push is fast-forward only, including if another writer raced us.
          git push origin "${GITHUB_SHA}:refs/heads/production"
          echo "::notice::Migrations succeeded and production points to $GITHUB_SHA. Check Hostinger's deployment log for the app build result."
